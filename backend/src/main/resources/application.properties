spring.application.name=volleyball-match-tracker
spring.config.import=optional:file:../.env[.properties]

server.address=127.0.0.1
server.port=${BACKEND_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:volleyball_match_tracker}
spring.datasource.username=${POSTGRES_USER:volleyball}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=volleyball

spring.flyway.locations=classpath:db/migration

management.endpoints.web.base-path=/api/system
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
