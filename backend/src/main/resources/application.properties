spring.application.name=volleyball-match-tracker
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
spring.config.import=optional:file:../.env[.properties]

server.address=127.0.0.1
server.port=${BACKEND_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:volleyball_match_tracker}
spring.datasource.username=${POSTGRES_USER:volleyball}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=volleyball

# Reject fractional integers and numeric enum ordinals in JSON requests.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

management.endpoints.web.base-path=/api/system
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Initial administrator creation is opt-in; credentials have no defaults.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
