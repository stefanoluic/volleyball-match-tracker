name: volleyball-match-tracker-demo

services:
  demo-database:
    image: postgres:18
    environment:
      POSTGRES_DB: volleyball_demo
      POSTGRES_USER: volleyball_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD for the separate local demo database}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - demo-database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  demo-database-data:
